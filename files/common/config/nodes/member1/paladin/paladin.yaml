log:
  level: info

nodeName: paladin1

blockchain:
  http:
    url: http://member1-besu:8545
  ws:
    url: ws://member1-besu:8546
    initialConnectAttempts: 25

db:
  type: postgres
  postgres:
    dsn: "postgres://postgres:my-secret@member1-postgres:5432/paladin1?sslmode=disable"
    autoMigrate: true
    migrationsDir: /app/db/migrations/postgres

rpcServer:
  http:
    address: "0.0.0.0"
    port: 8548
  ws:
    address: "0.0.0.0"
    port: 8549

wallets:
  - name: wallet1
    keySelector: .*
    signer:
      keyDerivation:
        type: bip32
      keyStore:
        type: static
        static:
          keys:
            seed:
              encoding: hex
              inline: 238e0b03c8a094554cde9d6b6750eea8687a5111ffe7c5015d6344f1f9c32f1f

domains:
  pente:
    # Deployed by paladin-bootstrap using rpcnode account (config/nodes/rpcnode/accountPrivateKey)
    # at nonce=0 — address is deterministic: ethers.getCreateAddress({ from: rpcnode, nonce: 0 })
    registryAddress: "0xBca0fDc68d9b21b5bfB16D784389807017B2bbbc"
    plugin:
      type: jar
      library: /app/domains/pente.jar
      class: io.kaleido.paladin.pente.domain.PenteDomainFactory
    config: {}
  noto:
    # Proxy deployed at nonce=3 (Noto impl at 1, NotoFactory impl at 2, ERC1967Proxy at 3)
    registryAddress: "0x9393486896D3ae612B4939afAF2C367Df17CC39B"
    plugin:
      type: c-shared
      library: /app/domains/libnoto.so
    config:
      factoryVersion: 2
  zeto:
    # Proxy deployed at nonce=5 (ZetoFactory impl at 4, ERC1967Proxy at 5)
    # Verifiers: Deposit(6), Withdraw(7), WithdrawBatch(8), Anon(9), AnonBatch(10)
    # Zeto_Anon impl at nonce=11; registerImplementation called after all deployments
    registryAddress: "0x49f8866d90ffDa8B12AC5677966e963acEc6d80E"
    allowSigning: true
    plugin:
      type: c-shared
      library: /app/domains/libzeto.so
    config:
      domainContracts:
        implementations:
          - name: Zeto_Anon
            circuits:
              deposit:
                name: deposit
              withdraw:
                name: withdraw
              transfer:
                name: anon
              transferLocked:
                name: anon
      snarkProver:
        circuitsDir: /app/domains/zeto/zkp
        provingKeysDir: /app/domains/zeto/zkp

transports:
  grpc:
    plugin:
      type: c-shared
      library: /app/transports/libgrpc.so
    config:
      address: "0.0.0.0"
      port: 9000
      externalHostname: "paladin1"
      directCertVerification: true
      tls:
        enabled: true
        certFile: /etc/paladin/certs/paladin.crt
        keyFile: /etc/paladin/certs/paladin.key

